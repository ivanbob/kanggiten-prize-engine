[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "payout-engine"
version = "0.1.0"
description = "Deterministic tournament payout optimization engine for online-casino slot races and operator tournaments."
readme = "Readme.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "numpy>=2.0.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[project.scripts]
payout = "cli.main:app"

[tool.setuptools.packages.find]
include = ["payout_engine*", "cli*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
